<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <header>
      <h1>🌸Your AI Poem Generator🌸</h1>
    </header>

    <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic for your poem"
          autofocus
          required
        />
        <input type="submit" />
      </form>

      <div>
        <p>
          A University degree, four books, and hundreds of articles and I still
          make mistakes when reading. You wrote me 'good morning' and I read it
          as 'I love you'.
        </p>
      </div>
    </main>
    <footer>
      This AI project was coded by Dianne Louise and is<a
        href="https://github.com/yan-codes/poem-generator"
        target="_blank"
        >open sourced on GitHub</a
      >and is hosted on
      <a
        href="https://ai-poem-generator-bymissdicodes.netlify.app"
        target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
